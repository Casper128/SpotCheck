name: spotcheck

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: production
      SPOTCHECK_PROXY_ORIGIN: ${SPOTCHECK_PROXY_ORIGIN:-http://localhost:${SPOTCHECK_PROXY_PORT:-3002}}
    ports:
      - "${SPOTCHECK_PORT:-3001}:3000"
    volumes:
      - pastel-data:/app/data
    restart: unless-stopped
    init: true
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/canvases').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      APP_ORIGIN: ${SPOTCHECK_APP_ORIGIN:-http://localhost:${SPOTCHECK_PORT:-3001}}
      PROXY_ORIGIN: ${SPOTCHECK_PROXY_ORIGIN:-http://localhost:${SPOTCHECK_PROXY_PORT:-3002}}
      PORT: "3002"
    ports:
      - "${SPOTCHECK_PROXY_PORT:-3002}:3002"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pastel-data:
    name: usewpastel_pastel-data
