name: spotcheck

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${SPOTCHECK_API_ORIGIN:-http://localhost:${SPOTCHECK_API_PORT:-4000}}
        NEXT_PUBLIC_PROXY_ORIGIN: ${SPOTCHECK_PROXY_ORIGIN:-http://localhost:${SPOTCHECK_PROXY_PORT:-3002}}
    ports:
      - "${SPOTCHECK_PORT:-3001}:3000"
    restart: unless-stopped
    init: true
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      APP_ORIGIN: ${SPOTCHECK_APP_ORIGIN:-http://localhost:${SPOTCHECK_PORT:-3001}}
      PROXY_ORIGIN: ${SPOTCHECK_PROXY_ORIGIN:-http://localhost:${SPOTCHECK_PROXY_PORT:-3002}}
      PORT: "3002"
    ports:
      - "${SPOTCHECK_PROXY_PORT:-3002}:3002"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
