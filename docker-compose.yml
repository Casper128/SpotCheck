name: spotcheck

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: production
    ports:
      - "${SPOTCHECK_PORT:-3001}:3000"
    volumes:
      - pastel-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/canvases').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pastel-data:
    name: usewpastel_pastel-data
