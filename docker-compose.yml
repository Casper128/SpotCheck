name: spotcheck
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${SPOTCHECK_APP_ORIGIN:-http://localhost:3001}
        NEXT_PUBLIC_PROXY_ORIGIN: ${SPOTCHECK_PROXY_ORIGIN:-http://preview.localhost:3001}
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://spotcheck:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or root .env}@postgres:5432/spotcheck?schema=public
      UPLOAD_DIRECTORY: /app/data/uploads
      FRONTEND_ORIGIN: ${SPOTCHECK_APP_ORIGIN:-http://localhost:3001}
      PUBLIC_API_ORIGIN: ${SPOTCHECK_APP_ORIGIN:-http://localhost:3001}
      PROXY_ORIGIN: ${SPOTCHECK_PROXY_ORIGIN:-http://preview.localhost:3001}
      PORT: "3000"
    ports:
      - "${SPOTCHECK_PORT:-3001}:3000"
    volumes:
      - app-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{headers:{Host:new URL(process.env.FRONTEND_ORIGIN).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: spotcheck
      POSTGRES_USER: spotcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotcheck -d spotcheck"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres-data:
  app-uploads:
